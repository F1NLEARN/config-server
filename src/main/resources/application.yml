server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/F1NLEARN/configs}
          default-label: main
          clone-on-start: true
          force-pull: true
          search-paths: common,{application}
        native:
          search-locations: file:${CONFIG_LOCAL_REPO_PATH:/configs}/common,file:${CONFIG_LOCAL_REPO_PATH:/configs}/{application}

eureka:
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: false
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_URL1:localhost}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always
